version: 1
# Toolchain: Node 24.21.0 (.node-version), python3 and authenticated
# Claude Code on PATH. Pushing main deploys through Cloudflare Pages.
commands:
  setup:
    - 'npm ci --no-audit --no-fund'
  fix: []
  checks:
    - name: js-syntax
      run: 'for f in functions/*.js lib/*.js public/*.js public/design/*.js scripts/*.mjs; do node --check "$f" || exit 1; done'
    - name: py-compile
      run: 'python3 -m py_compile scripts/*.py'
    - name: build
      run: 'npm run build'
    - name: scenario-checks
      run: 'STACK_MENU_CHECK_AGENT=1 npm run check'
  acceptance:
    run: 'NODE_PATH="$KOGEN_CUCUMBER" "$KOGEN_NODE" "$KOGEN_CUCUMBER/@cucumber/cucumber/bin/cucumber.js" --strict --require ''features/steps/*.js'' --format "message:$KOGEN_ACCEPTANCE_REPORT" "$KOGEN_ACCEPTANCE_FEATURES"'
    steps_dir: 'features/steps'
protect: []
